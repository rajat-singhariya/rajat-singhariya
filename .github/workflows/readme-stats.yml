name: Generate Readme Stats

on:
  schedule:
    - cron: "0 0 * * *"  # runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: "show_icons=true&theme=tokyonight&hide_border=true&count_private=true"
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "layout=compact&theme=tokyonight&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update readme stats [skip ci]"
          git push
